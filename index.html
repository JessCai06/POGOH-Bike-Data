<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cyanotype</title>
  <link rel="stylesheet" href="main.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
</head>
<body>

  <!-- Screen 1: Upload -->
  <div id="screen-upload" class="screen">
    <div id="upload-area">
      <p>Tap to upload a photo</p>
      <input type="file" id="upload-input" accept="image/*" capture="environment" />
    </div>
  </div>

  <!-- Screen 2: Studio -->
  <div id="screen-studio" class="screen">
    <div id="studio-topbar">
      <button id="btn-next-studio">Next →</button>
    </div>
    <div id="canvas-container">
      <canvas id="studioCanvas"></canvas>
    </div>
    <nav id="layer-panel">
      <div id="layer-list"></div>
    </nav>
    <div id="studio-bottombar">
      <button id="btn-add-sticker">+ Sticker</button>
      <input type="file" id="sticker-input" accept="image/png,image/gif,image/webp" />
    </div>
    <div id="trash-indicator">
      <div class="trash-icon">&#x2715;</div>
      <div class="trash-label">Release to delete</div>
    </div>
  </div>

  <!-- Screen 3: Negative Preview -->
  <div id="screen-negative" class="screen preview-screen">
    <div class="screen-label">Negative</div>
    <canvas id="negative-canvas"></canvas>
    <button id="btn-next-negative" class="btn-next">Next →</button>
  </div>

  <!-- Screen 4: Darkroom -->
  <div id="screen-darkroom" class="screen">
    <span id="darkroom-text">developing…</span>
  </div>

  <!-- Screen 5: Final -->
  <div id="screen-final" class="screen preview-screen">
    <div class="screen-label">Cyanotype</div>
    <canvas id="final-canvas"></canvas>
    <div class="final-actions">
      <button id="btn-download">Download</button>
      <button id="btn-start-over">Start Over</button>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
